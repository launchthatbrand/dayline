apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dayline-mysql-data
  namespace: launchthat
  labels:
    app: dayline
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dayline-mysql
  namespace: launchthat
  labels:
    app: dayline-mysql
spec:
  selector:
    app: dayline-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dayline-mysql
  namespace: launchthat
  labels:
    app: dayline-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dayline-mysql
  template:
    metadata:
      labels:
        app: dayline-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          args: ["--innodb-buffer-pool-size=67108864"]
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: dayline
            - name: MYSQL_USER
              value: dayline
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dayline-env
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dayline-env
                  key: MYSQL_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -udayline -p"$MYSQL_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dayline-mysql-data
