apiVersion: v1
kind: Service
metadata:
  name: dayline-dynamodb
  namespace: launchthat
  labels:
    app: dayline-dynamodb
spec:
  selector:
    app: dayline-dynamodb
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dayline-dynamodb
  namespace: launchthat
  labels:
    app: dayline-dynamodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dayline-dynamodb
  template:
    metadata:
      labels:
        app: dayline-dynamodb
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:2.6.0
          imagePullPolicy: IfNotPresent
          args: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
