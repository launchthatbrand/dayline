apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dayline
  namespace: launchthat
  labels:
    app: dayline
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: dayline.apps.onpoint.host
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dayline-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dayline-web
                port:
                  number: 3000
