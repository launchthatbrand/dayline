name: Deploy dayline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-dayline
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/launchthatbrand

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        run: mvn -B test

  build:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.tags.outputs.api_image }}
      web_image: ${{ steps.tags.outputs.web_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: tags
        run: |
          echo "api_image=${REGISTRY}/dayline-api:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "web_image=${REGISTRY}/dayline-web:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.api_image }}
            ${{ env.REGISTRY }}/dayline-api:latest
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.web_image }}
            ${{ env.REGISTRY }}/dayline-web:latest

  deploy:
    name: Roll k3s Deployment
    needs: build
    runs-on: [self-hosted, linux, x64, env:launchthat]
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      API_IMAGE: ${{ needs.build.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build.outputs.web_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply manifests
        run: kubectl apply -f deploy/k8s/
      - name: Roll images
        run: |
          set -euo pipefail
          kubectl -n launchthat set image deployment/dayline-api "dayline-api=${API_IMAGE}"
          kubectl -n launchthat set image deployment/dayline-stream "dayline-stream=${API_IMAGE}"
          kubectl -n launchthat set image deployment/dayline-web "dayline-web=${WEB_IMAGE}"
          kubectl -n launchthat rollout status deployment/dayline-api --timeout=240s
          kubectl -n launchthat rollout status deployment/dayline-stream --timeout=240s
          kubectl -n launchthat rollout status deployment/dayline-web --timeout=240s
